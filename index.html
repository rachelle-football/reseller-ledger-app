<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reseller Ledger</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js"></script>
<style>
  :root{
    --ink:#14181f;
    --ink-soft:#59606d;
    --ink-faint:#8b93a1;
    --paper:#f2f4f6;
    --surface:#ffffff;
    --surface-2:#eaeef1;
    --line:rgba(20,24,31,0.12);
    --line-strong:rgba(20,24,31,0.22);
    --accent:#0f7a82;
    --accent-strong:#0b5c63;
    --accent-soft:#e2f2f1;
    --accent-ink:#083f43;
    --good:#1f8a4c;
    --good-soft:#e4f6ea;
    --bad:#b3401f;
    --bad-soft:#fbeae3;
    --warn:#a8710b;
    --warn-soft:#faf0dd;
    --shadow:rgba(20,24,31,0.10);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#eef1f4;
      --ink-soft:#a7b0bd;
      --ink-faint:#707a89;
      --paper:#10141a;
      --surface:#181e26;
      --surface-2:#1f2630;
      --line:rgba(255,255,255,0.11);
      --line-strong:rgba(255,255,255,0.2);
      --accent:#4fd1d9;
      --accent-strong:#7fe3e8;
      --accent-soft:rgba(79,209,217,0.14);
      --accent-ink:#c9f3f5;
      --good:#4ade80;
      --good-soft:rgba(74,222,128,0.14);
      --bad:#f0836a;
      --bad-soft:rgba(240,131,106,0.14);
      --warn:#e0b04b;
      --warn-soft:rgba(224,176,75,0.14);
      --shadow:rgba(0,0,0,0.45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --ink:#eef1f4;
    --ink-soft:#a7b0bd;
    --ink-faint:#707a89;
    --paper:#10141a;
    --surface:#181e26;
    --surface-2:#1f2630;
    --line:rgba(255,255,255,0.11);
    --line-strong:rgba(255,255,255,0.2);
    --accent:#4fd1d9;
    --accent-strong:#7fe3e8;
    --accent-soft:rgba(79,209,217,0.14);
    --accent-ink:#c9f3f5;
    --good:#4ade80;
    --good-soft:rgba(74,222,128,0.14);
    --bad:#f0836a;
    --bad-soft:rgba(240,131,106,0.14);
    --warn:#e0b04b;
    --warn-soft:rgba(224,176,75,0.14);
    --shadow:rgba(0,0,0,0.45);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Manrope',system-ui,sans-serif;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    padding-inline:0;
  }
  h1,h2,h3,.display{
    font-family:'Sora',system-ui,sans-serif;
    font-weight:700;
    letter-spacing:-0.01em;
    text-wrap:balance;
    color:var(--ink);
    margin:0;
  }
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
  button{font-family:inherit;}
  input,select{font-family:inherit;}
  :focus-visible{outline:2.5px solid var(--accent); outline-offset:2px; border-radius:4px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

  .shell{max-width:960px; margin:0 auto; padding:0 16px calc(48px + env(safe-area-inset-bottom,0px));}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    padding-top:calc(14px + env(safe-area-inset-top,0px));
  }
  .topbar-inner{max-width:960px; margin:0 auto; padding:0 16px 12px;}
  .brand-row{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:9px;}
  .brand-mark{
    width:30px; height:30px; border-radius:8px; background:linear-gradient(150deg, var(--accent), var(--accent-strong));
    display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Sora'; font-weight:800; font-size:14px; flex:0 0 auto;
  }
  .brand h1{font-size:19px;}
  .company-switch{
    display:inline-flex; background:var(--surface-2); border-radius:999px; padding:3px; gap:2px; border:1px solid var(--line);
  }
  .company-switch button{
    border:none; background:transparent; padding:7px 14px; border-radius:999px; font-weight:700; font-size:13px; color:var(--ink-soft); cursor:pointer;
    white-space:nowrap;
  }
  .company-switch button.active{background:var(--accent); color:#fff;}

  .module-tabs{display:flex; gap:6px; margin-top:14px; overflow-x:auto; padding-bottom:2px;}
  .module-tab{
    flex:0 0 auto; padding:8px 14px; border-radius:10px 10px 0 0; font-weight:700; font-size:13.5px; cursor:pointer;
    border:1px solid transparent; border-bottom:none; color:var(--ink-soft); background:transparent;
  }
  .module-tab.active{background:var(--paper); color:var(--accent-strong); border-color:var(--line);}
  .module-tab.soon{cursor:default; opacity:.55;}
  .module-tab .tag{font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; background:var(--surface-2); color:var(--ink-faint); padding:2px 6px; border-radius:5px; margin-left:6px;}

  main{padding-top:20px;}

  .sync-banner{
    background:var(--warn-soft); color:var(--warn); border:1px solid var(--line); border-radius:10px;
    padding:10px 14px; font-size:13px; font-weight:600; margin-bottom:16px;
  }

  /* ---------- summary ---------- */
  .summary-row{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px;}
  @media (max-width:640px){ .summary-row{grid-template-columns:repeat(2,1fr);} }
  .stat{
    background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px;
  }
  .stat .num{font-family:'IBM Plex Mono'; font-variant-numeric:tabular-nums; font-size:22px; font-weight:600; color:var(--ink);}
  .stat .lbl{font-size:11.5px; color:var(--ink-faint); font-weight:700; text-transform:uppercase; letter-spacing:.05em; margin-top:2px;}
  .stat.owed .num{color:var(--bad);}

  /* ---------- toolbar ---------- */
  .toolbar{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center;}
  .search-input{
    flex:1 1 200px; padding:10px 13px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface);
    color:var(--ink); font-size:14px;
  }
  .btn{
    display:inline-flex; align-items:center; gap:6px; background:var(--accent); color:#fff; border:none; border-radius:10px;
    padding:10px 16px; font-weight:700; font-size:14px; cursor:pointer; white-space:nowrap; text-decoration:none;
  }
  .btn.whatsapp{background:#25D366; color:#fff;}
  .btn.whatsapp:hover{background:#1ebc59;}
  .btn:hover{background:var(--accent-strong);}
  .btn.secondary{background:transparent; color:var(--accent-strong); border:1.5px solid var(--accent);}
  .btn.ghost{background:transparent; color:var(--ink-soft); border:1.5px solid var(--line);}
  .btn.danger{background:transparent; color:var(--bad); border:1.5px solid var(--bad-soft);}
  .btn.small{padding:7px 12px; font-size:12.5px; border-radius:8px;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  /* ---------- reseller list ---------- */
  .reseller-grid{display:flex; flex-direction:column; gap:10px;}
  .reseller-card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px;
    display:flex; align-items:center; justify-content:space-between; gap:14px; cursor:pointer; flex-wrap:wrap;
    box-shadow:0 1px 2px var(--shadow);
  }
  .reseller-card:hover{border-color:var(--line-strong);}
  .rc-left{display:flex; align-items:center; gap:12px; min-width:0;}
  .avatar{
    width:38px; height:38px; border-radius:10px; background:var(--accent-soft); color:var(--accent-strong);
    display:flex; align-items:center; justify-content:center; font-family:'Sora'; font-weight:700; font-size:14.5px; flex:0 0 auto;
  }
  .rc-name{font-weight:700; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rc-meta{font-size:12.5px; color:var(--ink-faint); display:flex; gap:8px; flex-wrap:wrap; margin-top:2px;}
  .chip{display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700;}
  .chip.active{background:var(--good-soft); color:var(--good);}
  .chip.inactive{background:var(--surface-2); color:var(--ink-faint);}
  .chip.bw{background:var(--accent-soft); color:var(--accent-strong);}
  .chip.cd{background:var(--surface-2); color:var(--ink-soft);}
  .rc-balance{text-align:right; flex:0 0 auto;}
  .rc-balance .amt{font-family:'IBM Plex Mono'; font-size:16px; font-weight:600;}
  .rc-balance .amt.owed{color:var(--bad);}
  .rc-balance .amt.clear{color:var(--good);}
  .rc-balance .lbl{font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; font-weight:700;}

  .empty-state{
    text-align:center; padding:48px 20px; color:var(--ink-faint); background:var(--surface); border:1px dashed var(--line-strong); border-radius:14px;
  }
  .empty-state h3{color:var(--ink-soft); font-size:15px; margin-bottom:4px;}

  /* ---------- form ---------- */
  .panel{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:18px; box-shadow:0 1px 3px var(--shadow);}
  .panel h2{font-size:17px; margin-bottom:14px;}
  .card-title{font-size:15px; margin:0 0 10px; font-weight:700;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint);}
  .field input, .field select{
    padding:9px 11px; border-radius:9px; border:1.5px solid var(--line); background:var(--paper); color:var(--ink); font-size:14.5px;
  }
  .field input:focus, .field select:focus{border-color:var(--accent);}
  .form-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:14px;}
  @media (max-width:560px){ .form-grid{grid-template-columns:1fr;} }
  .check-field{display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:600; color:var(--ink-soft);}
  .check-field input{width:17px; height:17px; accent-color:var(--accent);}
  .form-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:4px;}

  /* ---------- detail view ---------- */
  .back-link{
    display:inline-flex; align-items:center; gap:6px; color:var(--ink-soft); font-weight:700; font-size:13.5px;
    background:none; border:none; cursor:pointer; padding:0; margin-bottom:14px;
  }
  .detail-head{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:18px; flex-wrap:wrap;}
  .detail-head h2{font-size:22px;}
  .detail-meta{color:var(--ink-faint); font-size:13.5px; margin-top:4px;}
  .balance-box{text-align:right;}
  .balance-box .amt{font-family:'IBM Plex Mono'; font-size:26px; font-weight:700;}
  .balance-box .amt.owed{color:var(--bad);}
  .balance-box .amt.clear{color:var(--good);}
  .balance-box .lbl{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:700;}

  .table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:12px;}
  table{width:100%; border-collapse:collapse; font-size:13.5px; min-width:560px;}
  th{
    text-align:left; padding:10px 12px; background:var(--surface-2); color:var(--ink-faint); font-size:11px;
    text-transform:uppercase; letter-spacing:.05em; font-weight:800; border-bottom:1px solid var(--line);
  }
  td{padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  td.num, th.num{text-align:right; font-family:'IBM Plex Mono'; font-variant-numeric:tabular-nums;}
  .debit-amt{color:var(--bad);}
  .credit-amt{color:var(--good);}
  .method-pill{font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--surface-2); color:var(--ink-soft);}
  .status-select{font-size:11.5px; font-weight:700; padding:4px 8px; border-radius:999px; border:none; cursor:pointer; font-family:inherit;}
  .note-cell{color:var(--ink-faint); font-size:12.5px; max-width:180px;}
  .del-cell{width:32px;}
  .icon-btn{background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:14px; padding:4px;}
  .icon-btn:hover{color:var(--bad);}

  .entry-form{display:grid; grid-template-columns:1fr 1fr 1fr 1fr auto; gap:8px; align-items:end; margin-top:14px;}
  @media (max-width:760px){ .entry-form{grid-template-columns:1fr 1fr;} }
  .entry-form .field.wide{grid-column:span 2;}

  /* ---------- bandwidth calc ---------- */
  .bw-table td, .bw-table th{white-space:nowrap;}
  .bw-table input{
    width:88px; padding:6px 8px; border-radius:7px; border:1.5px solid var(--line); background:var(--paper); color:var(--ink);
    font-family:'IBM Plex Mono'; font-size:13px; text-align:right;
  }
  .bw-total-row td{font-weight:700; background:var(--surface-2);}
  .bw-final-row td{font-weight:800; background:var(--accent-soft); color:var(--accent-ink); font-size:15px;}
  .deduct-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; flex-wrap:wrap;}

  /* ---------- invoices ---------- */
  .inv-summary-row{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px;}
  @media (max-width:640px){ .inv-summary-row{grid-template-columns:repeat(2,1fr);} }
  .inv-grid{display:flex; flex-direction:column; gap:10px;}
  .inv-card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px;
    display:flex; align-items:center; justify-content:space-between; gap:14px; cursor:pointer; flex-wrap:wrap;
    box-shadow:0 1px 2px var(--shadow);
  }
  .inv-card:hover{border-color:var(--line-strong);}
  .inv-num{font-family:'IBM Plex Mono'; font-size:12px; color:var(--ink-faint); font-weight:600;}
  .inv-client{font-weight:700; font-size:15px; margin-top:1px;}
  .inv-due{font-size:12.5px; color:var(--ink-faint); margin-top:2px;}
  .inv-total{font-family:'IBM Plex Mono'; font-size:16px; font-weight:600; text-align:right;}
  .status-pill{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; padding:3px 10px; border-radius:999px;}
  .status-pill.paid{background:var(--good-soft); color:var(--good);}
  .status-pill.unpaid{background:var(--warn-soft); color:var(--warn);}
  .status-pill.overdue{background:var(--bad-soft); color:var(--bad);}
  .status-pill.draft{background:var(--surface-2); color:var(--ink-faint);}
  .status-pill.sent{background:var(--accent-soft); color:var(--accent-strong);}
  .status-pill.accepted{background:var(--good-soft); color:var(--good);}
  .status-pill.rejected{background:var(--bad-soft); color:var(--bad);}
  .status-pill.expired{background:var(--bad-soft); color:var(--bad);}

  .line-item-row{display:grid; grid-template-columns:1fr 120px 90px 32px; gap:8px; align-items:center; margin-bottom:8px;}
  @media (max-width:600px){ .line-item-row{grid-template-columns:1fr; gap:6px; padding-bottom:10px; border-bottom:1px dashed var(--line);} }
  .line-item-row input[type=text]{padding:9px 11px; border-radius:9px; border:1.5px solid var(--line); background:var(--paper); color:var(--ink); font-size:14px;}
  .line-item-row input[type=number]{padding:9px 11px; border-radius:9px; border:1.5px solid var(--line); background:var(--paper); color:var(--ink); font-size:14px; font-family:'IBM Plex Mono'; text-align:right;}
  .line-item-row .rec-toggle{display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink-faint); font-weight:700; justify-content:center;}
  .line-item-row .rec-toggle input{accent-color:var(--accent);}

  /* the printable document itself: fixed brand colors, single theme by design */
  .invoice-doc{
    --iv-navy:#16244f; --iv-navy-2:#0d1a3a; --iv-orange:#ee6c2f; --iv-paper:#f8f7f3; --iv-line:rgba(22,36,79,0.14); --iv-ink:#16244f; --iv-soft:#5b6786;
    background:var(--iv-paper); color:var(--iv-ink); border-radius:14px; padding:36px 32px 28px; position:relative; overflow:hidden;
    font-family:'Manrope',sans-serif; border:1px solid var(--iv-line); box-shadow:0 1px 3px var(--shadow);
  }
  .invoice-doc::after{content:""; position:absolute; left:0; right:0; bottom:0; height:6px; background:var(--iv-orange);}
  .iv-head{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:26px;}
  .iv-logo{height:46px; display:block;}
  .iv-title{font-family:'Sora'; font-weight:700; font-size:28px; letter-spacing:.04em; color:var(--iv-navy); text-transform:uppercase;}
  .iv-meta-row{display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px;}
  .iv-contact{font-size:13.5px; color:var(--iv-navy); line-height:1.6;}
  .iv-due-lbl{font-size:11px; font-weight:800; letter-spacing:.08em; color:var(--iv-orange); text-align:right;}
  .iv-due-date{font-size:16px; font-weight:600; color:var(--iv-navy); text-align:right;}
  .iv-hr{border:none; border-top:1px solid var(--iv-line); margin:0 0 18px;}
  .iv-table{width:100%; border-collapse:collapse; font-size:14px; margin-bottom:18px;}
  .iv-table thead th{background:var(--iv-navy); color:#fff; text-align:left; padding:11px 14px; font-weight:600; font-size:13px;}
  .iv-table thead th.right{text-align:right;}
  .iv-table tbody td{padding:11px 14px; border-bottom:1px solid var(--iv-line); color:var(--iv-navy);}
  .iv-table tbody tr:nth-child(even){background:rgba(22,36,79,0.035);}
  .iv-table td.right{text-align:right; font-weight:700;}
  .iv-total-row{display:flex; justify-content:flex-end; align-items:baseline; gap:14px; margin-bottom:36px;}
  .iv-total-lbl{font-size:11px; font-weight:800; letter-spacing:.08em; color:var(--iv-soft);}
  .iv-total-amt{font-size:22px; font-weight:800; color:var(--iv-navy);}
  .iv-bottom{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap;}
  .iv-qr{width:88px; height:88px;}
  .iv-footer{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-top:22px; padding-top:14px; border-top:1px solid var(--iv-line); font-size:12.5px; color:var(--iv-soft);}
  .iv-thankyou{font-family:'Sora'; font-size:17px; color:var(--iv-navy); font-weight:600;}

  .inv-actions{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}

  .hide-until-print{display:none;}
  @media print{
    body *{visibility:hidden;}
    .printable-doc, .printable-doc *{visibility:visible;}
    .printable-doc{position:absolute; left:0; top:0; width:100%; box-shadow:none; border:none; border-radius:0;}
    .hide-until-print{display:block !important;}
  }

  .toast{
    position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:999px; font-weight:700; font-size:13.5px;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:50; max-width:90vw; text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .login-screen{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--paper); z-index:1000; padding:20px;}
  .login-card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:32px; width:100%; max-width:360px; box-shadow:0 10px 40px var(--shadow);}
  .login-brand{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
  .login-brand h1{font-family:'Sora'; font-size:19px; font-weight:700; color:var(--ink); margin:0;}
  .login-sub{font-size:13px; color:var(--ink-faint); margin:0 0 20px;}
  .login-form-fields{display:flex; flex-direction:column; gap:14px; margin-bottom:6px;}
  .login-error{font-size:12.5px; color:var(--bad); min-height:16px; margin:10px 0 4px;}

function money(n){
  n = Number(n) || 0;
  return "$" + n.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
}
function todayISO(){
  var d = new Date();
  return d.toISOString().slice(0,10);
}
function addDaysISO(days){
  var d = new Date();
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}
function moneyC(n, currency){
  n = Number(n) || 0;
  if (currency === "LBP"){
    return n.toLocaleString(undefined, {maximumFractionDigits:0}) + " LBP";
  }
  return money(n);
}
function whatsappLink(phone, text){
  var digits = (phone||"").replace(/[^0-9]/g, "");
  var base = digits ? ("https://wa.me/" + digits) : "https://wa.me/";
  return base + "?text=" + encodeURIComponent(text);
}
function initials(name){
  return (name||"?").trim().split(/\s+/).slice(0,2).map(function(w){return w[0]||"";}).join("").toUpperCase();
}

/* ============================== BOOT ============================== */

function boot(){
  try{
    db = firebase.firestore();
  }catch(e){ db = null; }

  if (!db){
    STATE.dbReady = false;
    render();
    return;
  }
  STATE.dbReady = true;

  // catalog
  try{
    var catDoc = db.doc("catalog/services");
    unsubCatalog = catDoc.onSnapshot(function(snap){
      if (snap.exists && snap.data() && Array.isArray(snap.data().items) && snap.data().items.length){
        STATE.catalog = snap.data().items;
      } else {
        STATE.catalog = DEFAULT_CATALOG.slice();
        catDoc.set({items:DEFAULT_CATALOG, updatedAt:new Date().toISOString()}).catch(function(){});
      }
      STATE.catalogLoaded = true;
      render();
    }, function(){ STATE.catalogLoaded = true; render(); });
  }catch(e){ STATE.catalogLoaded = true; }

  // resellers
  try{
    unsubResellers = db.collection("resellers").onSnapshot(function(qs){
      var list = [];
      qs.docs.forEach(function(d){
        var data = d.data() || {};
        list.push(Object.assign({id:d.id}, data));
      });
      list.sort(function(a,b){ return (a.name||"").localeCompare(b.name||""); });
      STATE.resellers = list;
      STATE.resellersLoaded = true;
      render();
    }, function(){ STATE.resellersLoaded = true; render(); });
  }catch(e){ STATE.resellersLoaded = true; }

  // invoices
  try{
    unsubInvoices = db.collection("invoices").onSnapshot(function(qs){
      var list = [];
      qs.docs.forEach(function(d){
        var data = d.data() || {};
        list.push(Object.assign({id:d.id}, data));
      });
      list.sort(function(a,b){ return (b.createdAt||"").localeCompare(a.createdAt||""); });
      STATE.invoices = list;
      STATE.invoicesLoaded = true;
      render();
    }, function(){ STATE.invoicesLoaded = true; render(); });
  }catch(e){ STATE.invoicesLoaded = true; }

  // settings
  try{
    var settingsDoc = db.doc("settings/invoice");
    unsubSettings = settingsDoc.onSnapshot(function(snap){
      if (snap.exists && snap.data()){
        STATE.settings = Object.assign({websiteUrl:DEFAULT_QR_URL}, snap.data());
      } else {
        STATE.settings = {websiteUrl:DEFAULT_QR_URL};
        settingsDoc.set({websiteUrl:DEFAULT_QR_URL, updatedAt:new Date().toISOString()}).catch(function(){});
      }
      STATE.settingsLoaded = true;
      render();
    }, function(){ STATE.settingsLoaded = true; render(); });
  }catch(e){ STATE.settingsLoaded = true; }

  // employees
  try{
    unsubEmployees = db.collection("employees").onSnapshot(function(qs){
      var list = [];
      qs.docs.forEach(function(d){
        var data = d.data() || {};
        list.push(Object.assign({id:d.id}, data));
      });
      list.sort(function(a,b){ return (a.firstName||"").localeCompare(b.firstName||""); });
      STATE.employees = list;
      STATE.employeesLoaded = true;
      render();
    }, function(){ STATE.employeesLoaded = true; render(); });
  }catch(e){ STATE.employeesLoaded = true; }

  // quotations
  try{
    unsubQuotations = db.collection("quotations").onSnapshot(function(qs){
      var list = [];
      qs.docs.forEach(function(d){
        var data = d.data() || {};
        list.push(Object.assign({id:d.id}, data));
      });
      list.sort(function(a,b){ return (b.createdAt||"").localeCompare(a.createdAt||""); });
      STATE.quotations = list;
      STATE.quotationsLoaded = true;
      render();
    }, function(){ STATE.quotationsLoaded = true; render(); });
  }catch(e){ STATE.quotationsLoaded = true; }

  // schedules
  try{
    unsubSchedules = db.collection("schedules").onSnapshot(function(qs){
      var list = [];
      qs.docs.forEach(function(d){
        var data = d.data() || {};
        list.push(Object.assign({id:d.id}, data));
      });
      STATE.schedules = list;
      STATE.schedulesLoaded = true;
      render();
    }, function(){ STATE.schedulesLoaded = true; render(); });
  }catch(e){ STATE.schedulesLoaded = true; }

  // inventory
  try{
    unsubInventory = db.collection("inventory").onSnapshot(function(qs){
      var list = [];
      qs.docs.forEach(function(d){
        var data = d.data() || {};
        list.push(Object.assign({id:d.id}, data));
      });
      STATE.inventory = list;
      STATE.inventoryLoaded = true;
      render();
    }, function(){ STATE.inventoryLoaded = true; render(); });
  }catch(e){ STATE.inventoryLoaded = true; }

  render();
}

function watchLedger(resellerId){
  if (unsubLedger) { unsubLedger(); unsubLedger = null; }
  STATE.ledger = [];
  STATE.ledgerLoaded = false;
  if (!db || !resellerId) return;
  try{
    unsubLedger = db.doc("resellers/"+resellerId).collection("ledger").onSnapshot(function(qs){
      var entries = [];
      qs.docs.forEach(function(d){ entries.push(Object.assign({id:d.id}, d.data())); });
      entries.sort(function(a,b){
        var ad = (a.date||""), bd=(b.date||"");
        if (ad !== bd) return ad < bd ? -1 : 1;
        return (a.createdAt||"") < (b.createdAt||"") ? -1 : 1;
      });
      STATE.ledger = entries;
      STATE.ledgerLoaded = true;
      render();
    }, function(){ STATE.ledgerLoaded = true; render(); });
  }catch(e){ STATE.ledgerLoaded = true; }
}

  }catch(e){ STATE.payrollLoaded = true; }
}

/* ============================== HELPERS ============================== */

function el(tag, attrs, children){
  var e = document.createElement(tag);
  attrs = attrs || {};
  Object.keys(attrs).forEach(function(k){
    if (k === "class") e.className = attrs[k];
    else if (k === "html") e.innerHTML = attrs[k];
    else if (k.indexOf("on") === 0 && typeof attrs[k] === "function") e.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== null && attrs[k] !== undefined) e.setAttribute(k, attrs[k]);
  });
  (children||[]).forEach(function(c){
    if (c === null || c === undefined) return;
    if (typeof c === "string" || typeof c === "number") e.appendChild(document.createTextNode(String(c)));
    else e.appendChild(c);
  });
  return e;
}

var toastTimer=null;
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2200);
}

function billingType(r){
  if (r.billingType) return r.billingType;
  return r.payPerBandwidth ? "bandwidth" : "creditDebit";
}
function isBandwidth(r){ return billingType(r) === "bandwidth"; }

function padR(s, n){
  s = String(s);
  return s.length >= n ? s.slice(0, n-1)+" " : s + " ".repeat(n - s.length);
}

function buildResellerMessage(r, bal, entries){
  var lines = [];
  lines.push("Hi " + (r.name||"") + ", here is your " + (r.company||"Libancom") + " account statement:");
  lines.push("");
  if (entries && entries.length){
    lines.push("```");
    lines.push(padR("Date",11) + padR("Type",7) + padR("Amount",11) + "Balance");
    var running = 0;
    entries.forEach(function(e){
      if (e.kind === "debit") running += Number(e.amount)||0; else running -= Number(e.amount)||0;
      lines.push(padR(e.date||"-",11) + padR(e.kind==="debit"?"Debit":"Credit",7) + padR(money(e.amount),11) + money(running));
    });
    lines.push("```");
    var notesWithText = entries.filter(function(e){ return e.note; });
    if (notesWithText.length){
      lines.push("");
      notesWithText.forEach(function(e){ lines.push("Note (" + e.date + "): " + e.note); });
    }
  } else {
    lines.push("No transactions yet.");
  }
  lines.push("");
  if (bal > 0) lines.push("Current balance due: " + money(bal));
  else if (bal < 0) lines.push("Credit balance: " + money(Math.abs(bal)));
  else lines.push("Your account is fully settled.");
  lines.push("");
  lines.push("Thank you!");
  return lines.join("\n");
}

function ledgerBalance(entries){
  var bal = 0;
  entries.forEach(function(e){
    if (e.kind === "debit") bal += Number(e.amount)||0;
    else bal -= Number(e.amount)||0;
  });
  return bal;
}

function resellerBalance(resellerId){
  // Only meaningful for the currently open ledger; for list totals we
  // rely on a cached balance field maintained alongside writes.
  var r = STATE.resellers.find(function(x){ return x.id === resellerId; });
  return r && typeof r.cachedBalance === "number" ? r.cachedBalance : 0;
}

function getQrDataUrl(text, size){
  if (!window.QRCode) return null;
  var tempDiv = document.createElement("div");
  tempDiv.style.position = "fixed";
  tempDiv.style.left = "-9999px";
  document.body.appendChild(tempDiv);
  var dataUrl = null;
  try{
    new QRCode(tempDiv, {text:text, width:size, height:size, colorDark:"#16244f", colorLight:"#ffffff"});
    var canvas = tempDiv.querySelector("canvas");
    if (canvas) dataUrl = canvas.toDataURL("image/png");
    else {
      var img = tempDiv.querySelector("img");
      if (img && img.src) dataUrl = img.src;
    }
  }catch(e){}
  document.body.removeChild(tempDiv);
  return dataUrl;
}

function savePdfBlob(doc, filename){
  var blob;
  try{ blob = doc.output("blob"); }catch(e){ toast("Couldn't build the PDF."); return; }
  try{
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

function computeInvoiceTotals(inv){
  var items = (inv && inv.lineItems) || [];
  var oneTime = 0, monthly = 0;
  items.forEach(function(it){
    var price = Number(it.price) || 0;
    if (it.recurring) monthly += price; else oneTime += price;
  });
  return {oneTime:oneTime, monthly:monthly};
}

function invoiceStatusInfo(inv){
  var status = inv.status || "unpaid";
  if (status === "paid") return {key:"paid", label:"Paid"};
  var overdue = inv.dueDate && inv.dueDate < todayISO();
  return overdue ? {key:"overdue", label:"Overdue"} : {key:"unpaid", label:"Unpaid"};
}

function buildInvoiceMessage(inv, totals){
  var lines = [];
  lines.push("Invoice " + (inv.invoiceNumber||"") + " — LibanCom");
  lines.push("Client: " + (inv.clientName||""));
  lines.push("Due Date: " + (inv.dueDate||""));
  lines.push("");
  (inv.lineItems||[]).forEach(function(it){
    lines.push("- " + (it.description||"") + ": " + money(it.price) + (it.recurring?"/month":""));
  });
  lines.push("");
  var totalLine = "Total: " + money(totals.oneTime) + (totals.monthly ? (" + " + money(totals.monthly) + "/month") : "");
  lines.push(totalLine);
  if (inv.notes) { lines.push(""); lines.push(inv.notes); }
  lines.push("");
  lines.push("Thank you!");
  return lines.join("\n");
}

function nextInvoiceNumber(){
  var maxN = 0;
  STATE.invoices.forEach(function(inv){
    var m = /(\d+)\s*$/.exec(inv.invoiceNumber || "");
    if (m) maxN = Math.max(maxN, parseInt(m[1], 10));
  });
  var n = maxN + 1;
  return "INV-" + String(n).padStart(4, "0");
}

function filteredInvoices(){
  var q = STATE.invoiceSearch.trim().toLowerCase();
  return STATE.invoices.filter(function(inv){
    if ((inv.company||"Libancom") !== STATE.company) return false;
    if (!q) return true;
    return (inv.clientName||"").toLowerCase().indexOf(q) !== -1 ||
           (inv.invoiceNumber||"").toLowerCase().indexOf(q) !== -1;
  });
}

  var wrap = document.createElement("div");

    wrap.appendChild(el("div",{class:"empty-state"},[

      el("div",{},["Invoices are currently only set up for Libancom."])
    ]));
    return wrap;
  }

  var list = filteredInvoices();
  var unpaidCount = 0, overdueCount = 0, outstanding = 0;

function employeeFullName(e){
  return ((e.firstName||"") + " " + (e.familyName||"")).trim() || "Unnamed";
}

function filteredEmployees(){
  var q = STATE.employeeSearch.trim().toLowerCase();
  return STATE.employees.filter(function(e){
    if ((e.company||"Libancom") !== STATE.company) return false;
    if (!q) return true;
    return employeeFullName(e).toLowerCase().indexOf(q) !== -1 ||
           (e.position||"").toLowerCase().indexOf(q) !== -1 ||
           (e.nationality||"").toLowerCase().indexOf(q) !== -1;
  });
}

/* ============================== QUOTATIONS ============================== */

function computeQuoteTotals(q){
  var items = (q && q.lineItems) || [];
  var oneTime = 0, monthly = 0;
  items.forEach(function(it){
    var price = Number(it.price) || 0;
    if (it.recurring) monthly += price; else oneTime += price;
  });
  return {oneTime:oneTime, monthly:monthly};
}

function quoteStatusInfo(q){
  var status = q.status || "draft";
  if (status === "accepted") return {key:"accepted", label:"Accepted"};
  if (status === "rejected") return {key:"rejected", label:"Rejected"};
  if (status === "draft") return {key:"draft", label:"Draft"};
  var expired = q.validUntil && q.validUntil < todayISO();
  return expired ? {key:"expired", label:"Expired"} : {key:"sent", label:"Sent"};
}

function buildQuoteMessage(q, totals){
  var lines = [];
  lines.push("Quotation " + (q.quotationNumber||"") + " — " + (q.company||"Libancom"));
  lines.push("Client: " + (q.clientName||""));
  lines.push("Valid Until: " + (q.validUntil||""));
  lines.push("");
  (q.lineItems||[]).forEach(function(it){
    lines.push("- " + (it.description||"") + ": " + money(it.price) + (it.recurring?"/month":""));
  });
  lines.push("");
  var totalLine = "Total: " + money(totals.oneTime) + (totals.monthly ? (" + " + money(totals.monthly) + "/month") : "");
  lines.push(totalLine);
  if (q.notes) { lines.push(""); lines.push(q.notes); }
  lines.push("");
  lines.push("Thank you!");
  return lines.join("\n");
}

function nextQuotationNumber(){
  var maxN = 0;
  STATE.quotations.forEach(function(q){
    var m = /(\d+)\s*$/.exec(q.quotationNumber || "");
    if (m) maxN = Math.max(maxN, parseInt(m[1], 10));
  });
  var n = maxN + 1;
  return "QUO-" + String(n).padStart(4, "0");
}

function filteredQuotations(){
  var q = STATE.quotationSearch.trim().toLowerCase();
  return STATE.quotations.filter(function(quo){
    if ((quo.company||"Libancom") !== STATE.company) return false;
    if (!q) return true;
    return (quo.clientName||"").toLowerCase().indexOf(q) !== -1 ||
           (quo.quotationNumber||"").toLowerCase().indexOf(q) !== -1;
  });
}

    if (info.key === "draft") draftCount++;
    if (info.key === "sent" || info.key === "expired") sentCount++;

function scheduleStatusStyle(status){
  if (status === "Done") return "background:var(--good-soft); color:var(--good);";
  if (status === "Cancelled") return "background:var(--surface-2); color:var(--ink-faint);";
  if (status === "In Progress") return "background:var(--accent-soft); color:var(--accent-strong);";
  return "background:var(--warn-soft); color:var(--warn);"; // Pending
}

function filteredSchedules(){
  var q = STATE.scheduleSearch.trim().toLowerCase();
  return STATE.schedules.filter(function(t){
    if ((t.company||"Libancom") !== STATE.company) return false;
    if (STATE.scheduleStatusFilter !== "all" && (t.status||"Pending") !== STATE.scheduleStatusFilter) return false;
    if (!q) return true;
    return (t.siteClient||"").toLowerCase().indexOf(q) !== -1 ||
           (t.responsible||"").toLowerCase().indexOf(q) !== -1 ||
           (t.taskType||"").toLowerCase().indexOf(q) !== -1 ||
           (t.notes||"").toLowerCase().indexOf(q) !== -1;
  }).sort(function(a,b){
    var ad = a.plannedDueDate || "9999-99-99";
    var bd = b.plannedDueDate || "9999-99-99";
    if (ad !== bd) return ad < bd ? -1 : 1;
    return (a.createdAt||"") < (b.createdAt||"") ? -1 : 1;
  });
}

/* ============================== INVENTORY <-> TASK SYNC ============================== */

function syncInventoryForTask(taskId, prevIds, newIds, status, siteClient, responsible){
  if (!db) return;
  prevIds = prevIds || [];
  newIds = newIds || [];
  var toAssign = [];
  var toRelease = [];
  prevIds.forEach(function(id){ if (newIds.indexOf(id) === -1) toRelease.push(id); });
  if (status === "Done"){
    newIds.forEach(function(id){ toAssign.push(id); });
  } else {
    newIds.forEach(function(id){ toRelease.push(id); });
  }
  toRelease = toRelease.filter(function(id, idx){ return toRelease.indexOf(id) === idx; });

  toAssign.forEach(function(id){
    var item = STATE.inventory.find(function(x){ return x.id === id; });
    if (item && item.status === "Faulty") return;
    db.doc("inventory/"+id).update({status:"Assigned", assignedTo:(siteClient || responsible || "—"), assignedTaskId: taskId || ""}).catch(function(){});
  });
  toRelease.forEach(function(id){
    var item = STATE.inventory.find(function(x){ return x.id === id; });
    if (item && item.status === "Faulty") return;
    db.doc("inventory/"+id).update({status:"In Stock", assignedTo:"", assignedTaskId:""}).catch(function(){});
  });
}

/* ============================== INVENTORY ============================== */

function inventoryStatusStyle(status){
  if (status === "Assigned") return "background:var(--accent-soft); color:var(--accent-strong);";
  if (status === "Faulty") return "background:var(--bad-soft); color:var(--bad);";
  return "background:var(--good-soft); color:var(--good);"; // In Stock
}

function filteredInventory(){
  var q = STATE.inventorySearch.trim().toLowerCase();
  return STATE.inventory.filter(function(it){
    if ((it.company||"Libancom") !== STATE.company) return false;
    if (STATE.inventoryStatusFilter !== "all" && (it.status||"In Stock") !== STATE.inventoryStatusFilter) return false;
    if (!q) return true;
    return (it.equipmentType||"").toLowerCase().indexOf(q) !== -1 ||
           (it.serialNumber||"").toLowerCase().indexOf(q) !== -1 ||
           (it.moduleNumber||"").toLowerCase().indexOf(q) !== -1 ||
           (it.brand||"").toLowerCase().indexOf(q) !== -1 ||
           (it.assignedTo||"").toLowerCase().indexOf(q) !== -1;
  }).sort(function(a,b){
    var at = (a.equipmentType||""), bt = (b.equipmentType||"");
    if (at !== bt) return at < bt ? -1 : 1;
    return (a.serialNumber||"").localeCompare(b.serialNumber||"");
  });
}

/* ============================== AUTH ============================== */

function showApp(show){
  document.getElementById("login-screen").style.display = show ? "none" : "flex";
  document.getElementById("topbar").style.display = show ? "" : "none";
  document.getElementById("shell").style.display = show ? "" : "none";
}

function teardownSubscriptions(){
  [unsubResellers, unsubLedger, unsubCatalog, unsubInvoices, unsubSettings,
   unsubEmployees, unsubPayroll, unsubQuotations, unsubSchedules, unsubInventory].forEach(function(unsub){
    if (unsub) { try{ unsub(); }catch(e){} }
  });
  unsubResellers = unsubLedger = unsubCatalog = unsubInvoices = unsubSettings = null;
  unsubEmployees = unsubPayroll = unsubQuotations = unsubSchedules = unsubInventory = null;
}

function friendlyAuthError(err){
  var code = err && err.code;
  if (code === "auth/wrong-password" || code === "auth/user-not-found" || code === "auth/invalid-credential") return "Incorrect email or password.";
  if (code === "auth/invalid-email") return "That doesn't look like a valid email address.";
  if (code === "auth/too-many-requests") return "Too many attempts — try again in a few minutes.";
  if (code === "auth/network-request-failed") return "Network error — check your internet connection.";
  if (code === "auth/user-disabled") return "This account has been disabled.";
  return "Something went wrong signing in — please try again.";
}

function initAuthGate(){
  showApp(false);
  var form = document.getElementById("login-form");
  var emailInput = document.getElementById("login-email");
  var passInput = document.getElementById("login-password");
  var errorEl = document.getElementById("login-error");
  var forgotLink = document.getElementById("login-forgot");
  var logoutBtn = document.getElementById("logout-btn");

  form.addEventListener("submit", function(ev){
    ev.preventDefault();
    errorEl.style.color = "";
    errorEl.textContent = "";
    var email = emailInput.value.trim();
    var password = passInput.value;
    if (!email || !password){ errorEl.textContent = "Enter your email and password."; return; }
    firebase.auth().signInWithEmailAndPassword(email, password).catch(function(err){
      errorEl.textContent = friendlyAuthError(err);
    });
  });

  forgotLink.addEventListener("click", function(ev){
    ev.preventDefault();
    errorEl.style.color = "";
    var email = emailInput.value.trim();
    if (!email){ errorEl.textContent = "Enter your email above first, then click \"Forgot password?\" again."; return; }
    firebase.auth().sendPasswordResetEmail(email).then(function(){
      errorEl.style.color = "var(--good)";
      errorEl.textContent = "Password reset email sent — check your inbox.";
    }).catch(function(err){
      errorEl.style.color = "";
      errorEl.textContent = friendlyAuthError(err);
    });
  });

  logoutBtn.addEventListener("click", function(){
    firebase.auth().signOut();
  });

  firebase.auth().onAuthStateChanged(function(user){
    if (user){
      var whoEl = document.getElementById("current-user-email");
      if (whoEl) whoEl.textContent = user.email || "";
      showApp(true);
      boot();
    } else {
      teardownSubscriptions();
      db = null;
      showApp(false);
      passInput.value = "";
    }
  });
}

initAuthGate();

})();
</script>

</body>
</html>
